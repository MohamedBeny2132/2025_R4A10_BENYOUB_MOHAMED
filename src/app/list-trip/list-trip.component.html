<ul>

    @for (trip of trips; track trip.id) {
       <li> <app-trip [trip]="trip"></app-trip> </li>
    }

</ul>

<div>
    <button (click)="previousPage()" [disabled]="currentPage === 1">Précédent</button>
    <span>Page {{ currentPage }} sur {{ nbPageMax() }}</span>
    <button (click)="nextPage()" [disabled]="currentPage === nbPageMax()">Suivant</button>
  </div>
